name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number whose leftover preview stage to destroy
        required: true
        type: string

concurrency:
  group: preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  STAGE: pr-${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  deploy:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: nubjs/setup-nub@v0
      - run: nub ci
      - name: Write preview env
        working-directory: packages/infra
        env:
          PR: ${{ github.event.number }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
        run: |
          : "${BETTER_AUTH_SECRET:?missing GitHub secret PREVIEW_BETTER_AUTH_SECRET}"
          : "${PR:?missing pull request number}"
          umask 077
          printf 'CORS_ORIGIN=%s\nBETTER_AUTH_SECRET=%s\n' \
            "https://crew-pr-${PR}.aleno.casa" \
            "$BETTER_AUTH_SECRET" \
            > .env.preview
      - name: Deploy preview
        working-directory: packages/infra
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?missing GitHub secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing GitHub secret CLOUDFLARE_ACCOUNT_ID}"
          nubx alchemy deploy --stage "$STAGE" --env-file .env.preview --yes
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url="https://crew-pr-${PR}.aleno.casa"
          marker="<!-- crew-preview -->"
          short="${SHA:0:7}"
          body="$(cat <<EOF
          ${marker}
          ## Preview

          **Play:** ${url}

          Isolated D1, rooms, and auth. Production is untouched.

          Commit \`${short}\`. Updates on each push; torn down when this PR closes.
          EOF
          )"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${comment_id}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="${body}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -f body="${body}"
          fi

  destroy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: nubjs/setup-nub@v0
      - run: nub ci
      - name: Refuse to destroy production
        run: |
          case "${STAGE}" in
            pr-[0-9]*) ;;
            *)
              echo "Refusing to destroy stage '${STAGE}'"
              exit 1
              ;;
          esac
      - name: Write preview env
        working-directory: packages/infra
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
        run: |
          : "${BETTER_AUTH_SECRET:?missing GitHub secret PREVIEW_BETTER_AUTH_SECRET}"
          : "${PR:?missing pull request number}"
          umask 077
          printf 'CORS_ORIGIN=%s\nBETTER_AUTH_SECRET=%s\n' \
            "https://crew-pr-${PR}.aleno.casa" \
            "$BETTER_AUTH_SECRET" \
            > .env.preview
      - name: Destroy preview
        working-directory: packages/infra
        env:
          CI: true
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?missing GitHub secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing GitHub secret CLOUDFLARE_ACCOUNT_ID}"
          nubx alchemy destroy --stage "$STAGE" --env-file .env.preview --yes
